<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payout Account Ready | NIL TV</title>
<meta name="description" content="Your NIL TV payout account is set up.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060608">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060608;
  --surface:#17171c;
  --text:#f5f5f7;
  --dim:#a8a8b3;
  --gold:#d9b25b;
  --border:rgba(255,255,255,0.09);
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',sans-serif;font-size:14px;line-height:1.55;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;-webkit-font-smoothing:antialiased;
}
.card{
  width:100%;max-width:420px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:40px 32px;text-align:center;
}
.card img{height:34px;width:auto;margin:0 auto 26px}
.check{
  width:52px;height:52px;margin:0 auto 20px;border-radius:50%;
  background:rgba(217,178,91,.12);border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
}
.check svg{width:24px;height:24px;stroke:var(--gold)}
h4{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:26px;letter-spacing:.02em;text-transform:uppercase;
  margin-bottom:10px;
}
p{color:var(--dim);margin-bottom:6px}
.btn{
  display:inline-block;margin-top:22px;padding:12px 30px;
  background:var(--gold);color:#151000;font-weight:600;font-size:14px;
  border-radius:999px;text-decoration:none;
}
.btn:hover{filter:brightness(1.07)}
.fine{font-size:12px;margin-top:22px;color:var(--dim);opacity:.75}
</style>
</head>
<body>
<div class="card">
  <img src="/assets/img/niltv-logo.webp" alt="NIL TV">
  <div class="check">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  </div>
  <h4>You're All Set</h4>
  <p>Your payout account is connected.</p>
  <p>Ambassador payments land in your bank about two days after we send them. Stripe emails you a receipt for every payout.</p>
  <a class="btn" href="/">Back to NIL TV</a>
  <p class="fine">Saved the setup link we texted you? Keep it. It becomes your payout dashboard link once you are approved.</p>
</div>
</body>
</html>
