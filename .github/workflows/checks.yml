name: Checks

# One runner for the small per-PR checks: the secret scan over the full history
# (plus a second scan from a private rule file when one is set)
# and the PR base rule. release is what production builds from, so only three
# kinds of branch may target it:
#   main       the promotion (normally a fast-forward push, a PR is also fine)
#   hotfix/*   an urgent fix that skips main (merge release back into main after)
#   revert-*   backing out a bad release
# Everything else belongs on main, which is the dev site. The check fails with
# a comment on how to retarget and re-runs when the base is edited.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    name: Secret scan and PR base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NAME_GUARD_TOML: ${{ secrets.NAME_GUARD_TOML }}
    steps:
      - name: Feature branches target main
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$BASE" != "release" ]; then
            echo "ok: $HEAD -> $BASE"
            exit 0
          fi
          case "$HEAD" in
            main|hotfix/*|revert-*)
              echo "ok: $HEAD -> release"
              exit 0 ;;
          esac

          marker="<!-- pr-base-guard -->"
          if ! gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$marker
          This PR targets **release**, which is what niltv.com builds from.

          Work lands on **main** first (the dev site). Release is promoted from main after sign-off.

          Change the base with the **Edit** button next to the title, or run \`gh pr edit $PR --base main\`. Only \`hotfix/*\` and \`revert-*\` branches may target release directly."
          fi
          echo "::error::'$HEAD' must target main, not release (release accepts only main, hotfix/*, revert-*)"
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan every commit reachable from this ref
        run: gitleaks git --redact --no-banner --verbose --exit-code 1 .
      - name: Second scan (private rule file)
        if: ${{ env.NAME_GUARD_TOML != '' }}
        run: |
          printf '%s\n' "$NAME_GUARD_TOML" > "$RUNNER_TEMP/name-guard.toml"
          gitleaks git --config "$RUNNER_TEMP/name-guard.toml" --redact --no-banner --exit-code 1 .
